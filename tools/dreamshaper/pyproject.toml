[project]
name = "keibook-dreamshaper"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "openvino==2026.4.0",
  "openvino-genai==2026.4.0.0",
  "huggingface-hub>=0.34,<1.22",
  "pillow>=11,<13",
]

[dependency-groups]
export = [
  "optimum-intel[openvino,diffusers]==2.2.0",
  "accelerate>=1,<2",
  "torch>=2.8,<3",
  "torchvision>=0.23,<1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
